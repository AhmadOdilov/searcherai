# Next.js serveriga uzatiladigan umumiy sarlavhalar.
#
# Nega kerak: Nginx ortida ilova HAR BIR so'rovni 172.x.x.x (Docker
# tarmog'i) dan kelgan deb ko'radi. Bu sarlavhalarsiz:
#   · cookie'ning `secure` bayrog'i noto'g'ri hisoblanardi (ilova so'rovni
#     HTTP deb o'ylab),
#   · loglarda va tezlik cheklovida (rate limit) hamma foydalanuvchi
#     bitta IP'dan kelgandek ko'rinardi.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket / HMR uchun (ishlab chiqishda kerak, productionda zarar qilmaydi).
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Ulanish o'rnatish vaqti — ilova qayta ishga tushayotgan bo'lsa tez xato
# bergani yaxshi (uzoq kutishdan ko'ra).
proxy_connect_timeout 10s;
