# Gzip siqish.
#
# Nega muhim: maqsadli foydalanuvchi — mobil internetdagi o'qituvchi.
# HTML va JS siqilganda 3-4 barobar kichrayadi, ya'ni sahifa shuncha
# tez ochiladi.
#
# Rasm, video va .pptx/.xlsx fayllar ro'yxatda YO'Q — ular allaqachon
# siqilgan, qayta siqish faqat protsessorni yeydi.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/javascript
  text/xml
  application/javascript
  application/json
  application/manifest+json
  application/xml
  application/rss+xml
  image/svg+xml
  font/ttf
  font/otf;
