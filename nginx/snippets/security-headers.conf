# HSTS — brauzer bu domenga faqat HTTPS orqali kirsin.
#
# ── Nega bu yerda FAQAT bitta sarlavha qoldi ─────────────────────────────────
# Qolgan xavfsizlik sarlavhalari (X-Frame-Options, X-Content-Type-Options,
# Referrer-Policy, Permissions-Policy, Cross-Origin-*) endi ILOVANING o'zida:
#   · `lib/security/headers.ts` — ro'yxat va har birining sababi
#   · `next.config.ts`          — ularni BARCHA yo'llarga qo'yadi
#   · `proxy.ts`                — CSP (u har so'rovda yangi nonce talab qiladi)
#
# Sabab — auditda topilgan nosozlik: Nginx'da `add_header` MEROS OLINMAYDI.
# O'z `add_header` i bor har bir `location` ota-blokdagilarni BEKOR qiladi,
# va yakuniy `location /` da bu snippet `include` qilinmagan edi. Natijada
# statik fayllar sarlavhalarni olardi, HAMMA HTML sahifa esa — yo'q.
# Ilovada esa bunday "jim yo'qolish" imkonsiz va sinov bilan tekshiriladi.
#
# ── Nega HSTS ILOVADA emas ──────────────────────────────────────────────────
# U faqat HTTPS javobida ma'noga ega, TLS'ni esa Nginx tugatadi. Ilovada ham
# qo'shsak, sarlavha ikki marta ketardi.
#
# DIQQAT: sertifikat ishlayotganiga ISHONCH hosil qilgandan keyin yoqing —
# noto'g'ri sozlangan HSTS saytni bir yilga ochib bo'lmaydigan qiladi.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
