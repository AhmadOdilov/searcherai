# Xavfsizlik sarlavhalari.
#
# DIQQAT: Nginx'da `add_header` MEROS OLINMAYDI — agar `location` ichida
# o'z `add_header` bo'lsa, `server` darajasidagilar BEKOR bo'ladi.
# Shuning uchun ular alohida faylga chiqarilgan va o'z sarlavhasi bor
# har bir `location` da qaytadan `include` qilinadi.

# Brauzer bu domenga faqat HTTPS orqali kirsin (bir yil).
# Sertifikat ishlayotganiga ISHONCH hosil qilgandan keyin yoqing —
# noto'g'ri sozlangan HSTS saytni bir yilga ochib bo'lmaydigan qiladi.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Fayl turini brauzer "taxmin qilmasin" (MIME sniffing).
add_header X-Content-Type-Options "nosniff" always;

# Saytni begona sahifa ichiga <iframe> qilib qo'ymasin (clickjacking).
add_header X-Frame-Options "SAMEORIGIN" always;

# Boshqa saytga o'tilganda to'liq manzil yuborilmasin.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
