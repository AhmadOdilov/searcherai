# Searcher AI — to'liq tekshiruv quvuri.
#
# ── Nega bitta ish (job), bir nechta emas ────────────────────────────────────
# Uchala test paketi ham BITTA PostgreSQL nusxasiga muhtoj, brauzer
# testlari esa qo'shimcha ravishda ishga tushirilgan ilovani talab qiladi.
# Ularni alohida ishlarga bo'lsak, har biri o'z bazasini ko'tarib,
# migratsiyalarni qayta qo'llardi — natija tezroq emas, faqat murakkabroq
# bo'lardi.
#
# ── Sirlar YO'Q ─────────────────────────────────────────────────────────────
# Bu quvurda hech qanday production hisob ma'lumoti ishlatilmaydi:
#  · baza — vaqtinchalik konteyner;
#  · AI — soxta server (`tests/e2e/helpers/mock-ai.ts`), haqiqiy provayder
#    umuman chaqirilmaydi;
#  · `AUTH_SECRET` — shu ish uchun yaratilgan qiymat.
# Shu sababdan quvur fork'dagi PR'larda ham xavfsiz ishlaydi.

name: verify

on:
  push:
    branches: ["**"]
  pull_request:

# Bir xil tarmoqqa yangi push kelsa, eskisini to'xtatamiz — navbat
# to'lib ketmasin.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Loyiha PostgreSQL 18 da ishlaydi (docker-compose.yml).
        image: postgres:18-alpine
        env:
          POSTGRES_USER: searcher
          POSTGRES_PASSWORD: searcher_ci_password
          POSTGRES_DB: searcher_ai
        ports:
          - 5432:5432
        # Migratsiya baza TAYYOR bo'lishini kutishi kerak.
        options: >-
          --health-cmd "pg_isready -U searcher -d searcher_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://searcher:searcher_ci_password@localhost:5432/searcher_ai?schema=public
      # 32 belgidan uzun — `lib/auth/jwt.ts` shuni talab qiladi.
      AUTH_SECRET: ci-uchun-yaratilgan-kalit-kamida-32-belgi
      APP_URL: http://localhost:3000
      # Sinovlar yuzlab hisob ochadi va hammasi bitta IP dan keladi.
      REGISTER_MAX_PER_IP: "1000"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Kamida 24 (LTS).
          #
          # Next.js 16 ning o'zi 20.9 dan boshlab ishlaydi, lekin sinov
          # skriptlari `--test-global-setup` bayrog'iga tayanadi
          # (`test:e2e`, `test:smoke`, `test:smoke:docker`) va u Node 22
          # da YO'Q — `node: bad option: --test-global-setup`. Birinchi
          # CI ishga tushishi aynan shunda yiqilgan edi.
          #
          # Ishlab chiqarish image'i (`Dockerfile`) 22 da QOLADI va bu
          # to'g'ri: ilovaning o'zi bu bayroqni ishlatmaydi, u faqat
          # test runner'ga kerak.
          node-version: 24
          cache: npm

      # `npm ci` — lockfile aynan bajariladi, `npm install` kabi uni
      # o'zgartirmaydi.
      - run: npm ci

      # Prisma klienti git'ga tushmaydi (`.gitignore`), shuning uchun
      # har ishda qaytadan yasaladi.
      - run: npx prisma generate

      - run: npx prisma migrate deploy

      # ── Next O'ZI yasaydigan tiplar ───────────────────────────────────
      # `PageProps` va `LayoutProps` global tiplari `.next/types` da
      # turadi va ularni Next generatsiya qiladi. Toza checkout'da
      # `.next` yo'q, ya'ni `tsc` ularni topa olmaydi va 9 ta TS2304
      # beradi. Mahalliy mashinada muammo KO'RINMAYDI: u yerda `.next`
      # `next dev`/`next build` dan qolgan bo'ladi — shuning uchun bu
      # nosozlik faqat CI'da chiqdi.
      #
      # `next typegen` aynan shu tiplarni to'liq build'siz yasaydi (~3 s),
      # ya'ni pastdagi `npm run build` takrorlanmaydi.
      - run: npx next typegen

      # ── Statik tekshiruvlar: eng tez yiqiladiganlari oldinda ──────────
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

      # ── Testlar ───────────────────────────────────────────────────────
      - run: npm test

      - run: npm run test:e2e

      # Brauzer testlari uchun faqat Chromium — ular CSS joylashuvini
      # tekshiradi, u esa brauzerlar orasida farq qilmaydi darajada
      # standart. `--with-deps` CI konteyneriga kerakli tizim
      # kutubxonalarini o'rnatadi.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

      # Build o'qituvchilar fayllarini deploy paketiga ko'chirmasligini
      # tekshiramiz. Belgi fayl OLDINDAN qo'yiladi: CI'da `storage/`
      # bo'sh bo'ladi va tekshiruv busiz hech narsa isbotlamasdi.
      #
      # Sabab: `lib/storage/local.ts` saqlagich ildizini
      # `path.join(process.cwd(), "storage")` bilan hisoblaydi va izlarni
      # yig'uvchi shu naqshga qarab butun papkani qo'shib yuborardi.
      # Chiqarib tashlash `next.config.ts` da.
      - run: mkdir -p storage/presentations && echo belgi > storage/presentations/belgi.pptx

      # `.env` ham deploy paketiga tushmasligi kerak. CI'da sirlar muhit
      # o'zgaruvchilari orqali beriladi, ya'ni `.env` fayli umuman yo'q —
      # tekshiruv busiz hech narsa isbotlamasdi. Shuning uchun belgi fayl
      # qo'yiladi. Ichidagi kalit ATAYLAB ishlatilmaydigan nom: Next uni
      # yuklasa ham hech narsaga ta'sir qilmaydi.
      - run: echo 'AUDIT_MARKER=belgi' > .env

      - run: npm run build

      - name: .env standalone paketiga tushmaganini tekshirish
        run: |
          if compgen -G ".next/standalone/.env*" > /dev/null; then
            echo "XATO: .env deploy paketiga ko'chirilgan:"
            ls -la .next/standalone/.env*
            exit 1
          fi
          echo ".env paketga tushmadi — to'g'ri"
        shell: bash

      - name: storage standalone paketiga tushmaganini tekshirish
        run: |
          if [ -e .next/standalone/storage ]; then
            echo "XATO: storage/ standalone paketiga ko'chirilgan:"
            find .next/standalone/storage -type f
            exit 1
          fi
          echo "storage/ paketga tushmadi — to'g'ri"

      # Nosozlik sababini ko'rish uchun — muvaffaqiyatda saqlanmaydi.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Production ARTEFAKTI ────────────────────────────────────────────────────
  # Nega alohida ish: yuqoridagi `verify` manba kodini tekshiradi —
  # `next dev` serveri, birlik sinovlari, brauzer. Bu yerda esa DEPLOY
  # QILINADIGAN NARSANING o'zi sinaladi: `next build` chiqargan standalone
  # paketi va `Dockerfile` dan yig'ilgan image.
  #
  # Farq nazariy emas. Phase 5 va Phase 6 dagi ikkala nuqson ham
  # (`storage/` va `.env` ning deploy paketiga tushishi) 826 ta yashil
  # testdan o'tib ketgan edi: ularning birortasi ham haqiqiy paketni
  # ko'rmasdi. Shu sababdan bu ish `verify` ga bog'lanmaydi va u bilan
  # PARALLEL ishlaydi — ikkalasi boshqa-boshqa nosozlik sinfini tutadi.
  production-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: searcher
          POSTGRES_PASSWORD: searcher_ci_password
          POSTGRES_DB: searcher_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U searcher -d searcher_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://searcher:searcher_ci_password@localhost:5432/searcher_ai?schema=public
      AUTH_SECRET: ci-uchun-yaratilgan-kalit-kamida-32-belgi
      # Smoke to'plami ilovaga O'ZINING soxta AI manzilini beradi
      # (`tests/smoke/helpers/target.ts`). Bu qiymat boshqa maqsad uchun:
      # "paketda sir bormi?" tekshiruvi AYNAN shu satrni qidiradi. 16
      # belgidan uzun bo'lishi shart, aks holda tekshiruv uni chetlab
      # o'tadi va hech narsa isbotlamaydi.
      AI_API_KEY: ci-soxta-ai-kaliti-hech-qayerda-ishlatilmaydi
      REGISTER_MAX_PER_IP: "1000"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Yuqoridagi ish bilan bir xil sabab: smoke to'plami
          # `--test-global-setup` bayrog'i bilan ishga tushadi.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      # ── Belgi fayllar: tekshiruvlar BO'SH bo'lib qolmasin ────────────────
      # Toza checkout'da `storage/` bo'sh va `.env` umuman yo'q (CI sirlarni
      # muhit o'zgaruvchilari orqali oladi). Ya'ni "paketda storage yo'q" va
      # "paketda .env yo'q" tasdiqlari hech narsa isbotlamasdan yashil
      # bo'lardi — aynan o'sha yolg'on yashillik Phase 5 va Phase 6
      # nuqsonlarini o'tkazib yuborgan edi.
      #
      # Shuning uchun build'dan OLDIN ikkala fayl ATAYLAB qo'yiladi: agar
      # chiqarib tashlash ishlamay qolsa, ular paketda paydo bo'ladi va
      # `tests/smoke/standalone.smoke.ts` darhol yiqiladi.
      #
      # `.env` ichidagi kalit ataylab ishlatilmaydigan nom: Next uni yuklasa
      # ham hech narsaga ta'sir qilmaydi.
      - name: Chiqarib tashlash tekshiruvlari uchun belgi fayllar
        run: |
          mkdir -p storage/presentations
          echo belgi > storage/presentations/belgi.pptx
          echo 'AUDIT_MARKER=belgi' > .env

      # `npm run test:smoke` build'ni O'ZI bajaradi — ya'ni bu qadam
      # ayni paytda "Build PASS" darvozasi ham.
      - name: Standalone artefakt smoke
        run: npm run test:smoke

      # Docker yo'li image'ni `Dockerfile` dan qaytadan yig'adi. Konteyner
      # xostdagi Postgres va soxta AI serveriga `host.docker.internal`
      # orqali ulanadi — `--add-host=...:host-gateway` buni Linux
      # runner'da ham beradi.
      - name: Docker artefakt smoke
        run: npm run test:smoke:docker

      # Nosozlik sababi: konteyner jurnali odatda yagona manba.
      - if: failure()
        run: docker logs searcher-ai-smoke 2>&1 | tail -100 || true
